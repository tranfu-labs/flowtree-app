server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /market-data.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location /api/eastmoney/ {
    proxy_pass https://push2.eastmoney.com/api/;
    proxy_ssl_server_name on;
    proxy_set_header Host push2.eastmoney.com;
    proxy_set_header Referer https://data.eastmoney.com/;
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_connect_timeout 12s;
    proxy_send_timeout 20s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
